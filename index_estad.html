<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./img/logo.png">
    <link rel="apple-touch-icon" href="./img/logo.png">
    <title>CV Stats - Pro Mode</title>
    <script src="./libs/tailwind.js"></script>
    <script src="./libs/charts.js"></script>
    <style>
        :root{--b:#0056FF}body{font-family:'Inter',system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#F3F4F6}.card{background:#fff;border-radius:1.5rem;box-shadow:0 4px 20px -2px rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.05)}.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:1rem 2rem;border-radius:1rem;opacity:0;transition:opacity .3s;z-index:9999}.v{opacity:1}.app-input{background:#fff;border:2px solid #E5E7EB;padding:.8rem;border-radius:1rem;transition:all .2s;font-weight:600}.app-input:focus{border-color:var(--b);outline:0;ring:2px}.btn-intense{transition:all .1s;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1))}.btn-intense:active{transform:scale(0.96);filter:brightness(0.9)}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.btn-action{padding:.75rem .5rem;border-radius:.75rem;font-size:11px;font-weight:800;text-align:center;border:2px solid transparent;transition:all .2s;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.2}.btn-pos{background-color:#DBEAFE;color:#1E40AF;border-color:#BFDBFE}.btn-neg{background-color:#FEE2E2;color:#991B1B;border-color:#FECACA}.btn-selected{border-color:#000!important;transform:scale(1.03);box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    </style>
</head>
<body class="p-4 pb-12 text-gray-800" oncontextmenu="return false">

    <main class="max-w-md mx-auto space-y-6">
        <header class="flex justify-between items-center py-2">
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter text-gray-900">CONTROL <span class="text-blue-600">VOLEY</span></h1>
                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Estadísticas Pro</p>
            </div>
            <button onclick="if(confirm('¿Salir?'))window.close()" class="bg-red-600 text-white px-5 py-2 rounded-2xl text-xs font-black shadow-lg">SALIR</button>
        </header>

        <div class="card p-6">
            <h2 class="text-xs font-black uppercase tracking-widest text-blue-700 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-blue-600 rounded-full"></span> Nuevo Atleta
            </h2>
            <div class="flex gap-2">
                <input id="pN" placeholder="N°" class="w-16 app-input text-center" type="number">
                <input id="pM" placeholder="Nombre" class="flex-grow app-input" type="text">
                <button id="add" class="btn-intense bg-blue-600 text-white px-6 rounded-2xl font-black text-xl">+</button>
            </div>
        </div>

        <div class="card p-6 border-t-4 border-blue-600">
            <h2 class="text-xs font-black uppercase tracking-widest text-blue-700 mb-4 text-center">Panel de Registro</h2>
            <form id="f" class="space-y-4">
                <select id="ps" class="w-full app-input text-gray-900 shadow-sm"></select>
                <div id="actionContainer" class="action-grid"></div>
                <input type="hidden" id="as">
                <button class="btn-intense w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-blue-200 mt-2">Registrar Acción</button>
                <div class="grid grid-cols-2 gap-4 mt-2">
                    <button type="button" id="rs" class="btn-intense bg-amber-500 text-white py-4 rounded-2xl text-xs font-black uppercase shadow-lg shadow-amber-100">Limpiar Set</button>
                    <button type="button" id="ra" class="btn-intense bg-red-600 text-white py-4 rounded-2xl text-xs font-black uppercase shadow-lg shadow-red-100">Borrar Todo</button>
                </div>
            </form>
        </div>

        <div class="card p-6">
            <h2 class="text-xs font-black uppercase tracking-widest text-blue-700 mb-4 text-center">Resumen por Jugador</h2>
            <div id="st" class="space-y-3 max-h-72 overflow-y-auto"></div>
        </div>

        <div class="card p-4 h-72"><canvas id="c1"></canvas></div>
        <div class="card p-4 h-96">
            <div id="sum" class="text-center mb-4 text-xs font-black text-white bg-blue-600 py-3 rounded-xl shadow-inner uppercase"></div>
            <canvas id="c2"></canvas>
        </div>
    </main>
