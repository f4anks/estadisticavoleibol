<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./img/logo.png">
    <link rel="apple-touch-icon" href="./img/logo.png">
    <title>Voley Stats - Estadísticas Pro</title>
    <script src="./libs/tailwind.js"></script>
    <script src="./libs/charts.js"></script>
    <style>
        :root{--b:#0056FF}body{font-family:'Inter',system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#F3F4F6}.card{background:#fff;border-radius:1.5rem;box-shadow:0 4px 20px -2px rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.05)}.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:1rem 2rem;border-radius:1rem;opacity:0;transition:opacity .3s;z-index:9999}.v{opacity:1}.app-input{background:#fff;border:2px solid #E5E7EB;padding:.8rem;border-radius:1rem;transition:all .2s;font-weight:600}.app-input:focus{border-color:var(--b);outline:0;box-shadow:0 0 0 2px rgba(0,86,255,0.2)}.btn-intense{transition:all .1s;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1))}.btn-intense:active{transform:scale(0.96);filter:brightness(0.9)}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.btn-action{padding:.75rem .5rem;border-radius:.75rem;font-size:11px;font-weight:800;text-align:center;border:2px solid transparent;transition:all .2s;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.2}.btn-pos{background-color:#DBEAFE;color:#1E40AF;border-color:#BFDBFE}.btn-neg{background-color:#FEE2E2;color:#991B1B;border-color:#FECACA}.btn-selected{border-color:#000!important;transform:scale(1.03);box-shadow:0 4px 10px rgba(0,0,0,0.1)}
        .tab-btn{transition:all 0.2s;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:0.05em}
        .tab-active{background-color:#0056FF!important;color:white!important;box-shadow:0 4px 12px rgba(0,86,255,0.3)}
    </style>
</head>
<body class="p-4 pb-12 text-gray-800" oncontextmenu="return false">

    <main class="max-w-md mx-auto space-y-6">
        <header class="flex justify-between items-center py-2">
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter text-gray-900 uppercase">VOLEY <span class="text-blue-600">STATS</span></h1>
                <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Estadísticas Pro</p>
            </div>
            <button onclick="window.location.href='index_menu.html'" class="bg-red-600 text-white px-5 py-2 rounded-2xl text-xs font-black shadow-lg uppercase tracking-wider">Salir</button>
        </header>

        <div class="card p-6">
            <h2 class="text-xs font-black uppercase tracking-widest text-blue-700 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-blue-600 rounded-full"></span> Registro de Atleta
            </h2>
            <div class="flex gap-2">
                <input id="pN" placeholder="N°" class="w-16 app-input text-center" type="number">
                <input id="pM" placeholder="Nombre" class="flex-grow app-input" type="text">
                <button id="add" class="btn-intense bg-blue-600 text-white px-6 rounded-2xl font-black text-xl">+</button>
            </div>
        </div>

        <div class="card p-6 border-t-4 border-blue-600">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xs font-black uppercase tracking-widest text-blue-700">Toma de Datos</h2>
                <span id="setIndicator" class="bg-blue-600 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">SET 1</span>
            </div>
            <form id="f" class="space-y-4">
                <select id="ps" class="w-full app-input text-gray-900 shadow-sm font-bold uppercase"></select>
                <div id="actionContainer" class="action-grid"></div>
                <input type="hidden" id="as">
                <button class="btn-intense w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-blue-200 mt-2">Registrar Acción</button>
                
                <div class="grid grid-cols-2 gap-4 mt-2">
                    <button type="button" id="cSet" class="btn-intense bg-emerald-600 text-white py-4 rounded-2xl text-xs font-black uppercase shadow-lg shadow-emerald-100">Fijar / Cerrar Set</button>
                    <button type="button" id="ra" class="btn-intense bg-red-600 text-white py-4 rounded-2xl text-xs font-black uppercase shadow-lg shadow-red-100">Borrar Todo</button>
                </div>
            </form>
        </div>

        <div class="grid grid-cols-4 gap-1 bg-gray-200 p-1.5 rounded-2xl">
            <button id="t-all" class="tab-btn py-2.5 rounded-xl bg-white text-gray-700 tab-active">Total</button>
            <button id="t-1" class="tab-btn py-2.5 rounded-xl bg-white text-gray-400">Set 1</button>
            <button id="t-2" class="tab-btn py-2.5 rounded-xl bg-white text-gray-400">Set 2</button>
            <button id="t-3" class="tab-btn py-2.5 rounded-xl bg-white text-gray-400">Set 3</button>
        </div>

        <div class="card p-6">
            <h2 id="resumenTitle" class="text-xs font-black uppercase tracking-widest text-blue-700 mb-4 text-center">Resumen de Efectividad (General)</h2>
            <div id="st" class="space-y-3 max-h-72 overflow-y-auto"></div>
        </div>

        <div class="card p-4 h-72"><canvas id="c1"></canvas></div>
        <div class="card p-4 h-96">
            <div id="sum" class="text-center mb-4 text-xs font-black text-white bg-blue-600 py-3 rounded-xl shadow-inner uppercase"></div>
            <canvas id="c2"></canvas>
        </div>
    </main>

    <footer class="mt-8 mb-4 text-center">
        <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Programación y Desarrollo: Sistematikos - Frank Hernandez</p>
    </footer>

<script>
(function(){
    const _0x1a9b=(id)=>document.getElementById(id);

    // Seguridad Estricta Sistematikos
    document.addEventListener('keydown',function(e){
        if(e.keyCode==123||(e.ctrlKey&&e.shiftKey&&(e.keyCode==73||e.keyCode==74))||(e.ctrlKey&&e.keyCode==85)){e.preventDefault();return false}
    });

    // Estado del Juego Estructurado por Sets
    let athletes=[], currentSet=1, activeTab='all';
    let setLogs={ 1:[], 2:[], 3:[] };

    const actionsDict={'Servicio Bueno S#':1,'Ataque Bueno A#':1,'Bloqueo Bueno B#':1,'Coloque Bueno C#':1,'Defensa Bueno D#':1,'Recepcion Bueno R#':1,'Servicio Malo S=':-1,'Ataque Malo A=':-1,'Bloqueo Malo B=':-1,'Recepcion Malo R=':-1,'Coloque Malo C=':-1,'Defensa Malo D=':-1};
    const categories={S:'Servicio',A:'Ataque',B:'Bloqueo',R:'Recepcion',C:'Coloque',D:'Defensa'};
    const colors={b:'#0056FF',r:'#dc2626',o:'#f97316',g:'#10b981'},chartConfig={responsive:1,maintainAspectRatio:0,scales:{y:{ticks:{stepSize:1,font:{weight:'bold'}}}}};
    
    let chart1=null, chart2=null;

    function showToast(msg){
        const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
        setTimeout(()=>t.classList.add('v'),10);
        setTimeout(()=>{t.classList.remove('v');setTimeout(()=>t.remove(),300)},2000);
    }

    function saveData(){
        localStorage.setItem('vP',JSON.stringify(athletes));
        localStorage.setItem('vS_Logs',JSON.stringify(setLogs));
        localStorage.setItem('vS_Current',JSON.stringify(currentSet));
    }

    function loadData(){
        athletes=JSON.parse(localStorage.getItem('vP')||'[]');
        setLogs=JSON.parse(localStorage.getItem('vS_Logs')||'{"1":[],"2":[],"3":[]}');
        currentSet=JSON.parse(localStorage.getItem('vS_Current')||'1');
        _0x1a9b('setIndicator').textContent=`SET ${currentSet}`;
    }

    function renderAll(){
        const container=_0x1a9b('st');container.innerHTML='';
        
        // Determinar qué logs procesar según la pestaña activa
        let targetLogs=[];
        if(activeTab==='all'){
            targetLogs=[...setLogs[1], ...setLogs[2], ...setLogs[3]];
            _0x1a9b('resumenTitle').textContent="Resumen de Efectividad (Partido Completo)";
        } else {
            targetLogs=setLogs[activeTab]||[];
            _0x1a9b('resumenTitle').textContent=`Resumen de Efectividad (Set ${activeTab})`;
        }

        if(!athletes.length){container.innerHTML='<p class="text-center text-gray-400 py-4 italic">Sin datos</p>';return}

        // Procesar matriz de rendimientos
        let metrics={};
        athletes.forEach(p=>metrics[p.number]={p:0,n:0,actions:{}});

        targetLogs.forEach(log=>{
            let m=metrics[log.playerNumber];
            if(m){
                let val=actionsDict[log.action], type=log.action.charAt(log.action.length-2);
                val>0?m.p++:m.n++;
                if(!m.actions[type])m.actions[type]={p:0,n:0};
                val>0?m.actions[type].p++:m.actions[type].n++;
            }
        });

        athletes.forEach(p=>{
            let m=metrics[p.number], breakdown='';
            Object.keys(m.actions).forEach(k=>breakdown+=`<span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-100">${k}:${m.actions[k].p}|${m.actions[k].n}</span> `);
            container.innerHTML+=`<div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 shadow-sm"><div class="flex justify-between items-center font-black text-sm mb-2"><span>#${p.number} ${p.name}</span><span class="text-blue-600 bg-white px-3 py-1 rounded-full shadow-sm">DIF: ${m.p-m.n}</span></div><div class="text-[10px] font-bold flex flex-wrap gap-1">${breakdown||'<span class="text-gray-400 italic">Sin acciones</span>'}</div></div>`;
        });

        // Actualizar Gráficas de Barras Integradas
        if(typeof Chart==='undefined')return;

        const ctx1=_0x1a9b('c1').getContext('2d'), ctx2=_0x1a9b('c2').getContext('2d'), labelsList=Object.values(categories);
        let currentChartData={p:[],n:[]}, totalChartData={p:[],n:[]}, totP=0, totN=0;

        Object.keys(categories).forEach(k=>{
            let cp=0, cn=0, tp=0, tn=0;
            
            // Datos del Set/Pestaña seleccionada
            targetLogs.forEach(z=>{
                if(z.action.charAt(z.action.length-2)===k)actionsDict[z.action]>0?cp++:cn++;
            });
            // Datos Consolidados del Partido General
            [...setLogs[1], ...setLogs[2], ...setLogs[3]].forEach(z=>{
                if(z.action.charAt(z.action.length-2)===k){
                    if(actionsDict[z.action]>0){tp++;totP++}else{tn++;totN++}
                }
            });

            currentChartData.p.push(cp);currentChartData.n.push(cn);
            totalChartData.p.push(tp);totalChartData.n.push(tn);
        });

        if(chart1)chart1.destroy();
        chart1=new Chart(ctx1,{type:'bar',data:{labels:labelsList,datasets:[{label:'+',data:currentChartData.p,backgroundColor:colors.b,borderRadius:8},{label:'-',data:currentChartData.n,backgroundColor:colors.o,borderRadius:8}]},options:{...chartConfig,plugins:{title:{display:1,text:(activeTab==='all'?'PARTIDO COMPLETO':'SET '+activeTab),font:{weight:'900',size:14}}}}});

        _0x1a9b('sum').innerHTML=`POS: ${totP} | NEG: ${totN} | TOTAL: ${totP+totN}`;
        
        if(chart2)chart2.destroy();
        chart2=new Chart(ctx2,{type:'bar',data:{labels:labelsList,datasets:[{label:'TOTAL +',data:totalChartData.p,backgroundColor:colors.g,borderRadius:8},{label:'TOTAL -',data:totalChartData.n,backgroundColor:colors.o,borderRadius:8}]},options:{...chartConfig,plugins:{title:{display:1,text:'BALANCE GENERAL DEL PARTIDO',font:{weight:'900',size:14}}}}});
    }

    document.addEventListener('DOMContentLoaded', RhineVoley=>{
        loadData();
        const selectMenu=_0x1a9b('ps'), actionInput=_0x1a9b('as'), actionsGrid=_0x1a9b('actionContainer');
        
        // Generar Botones de Control
        Object.keys(actionsDict).forEach(k=>{
            const b=document.createElement('div');
            const isPos=actionsDict[k]>0, splitText=k.split(' ');
            b.innerHTML=`<span>${splitText[0]}</span><span class="text-lg">${splitText[2]}</span>`;
            b.className=`btn-action ${isPos?'btn-pos':'btn-neg'}`;
            b.onclick=()=>{document.querySelectorAll('.btn-action').forEach(x=>x.classList.remove('btn-selected'));b.classList.add('btn-selected');actionInput.value=k};
            actionsGrid.appendChild(b);
        });

        function updateDropdown(){
            selectMenu.innerHTML='<option value="" disabled selected>SELECCIONAR ATLETA</option>';
            athletes.sort((a,b)=>a.number-b.number).forEach(p=>{
                let o=document.createElement('option');o.value=p.number;o.textContent=`#${p.number} - ${p.name}`;
                selectMenu.appendChild(o);
            });
        }

        // Manejo de Filtros por Pestaña
        const tabButtons={ 'all':_0x1a9b('t-all'), '1':_0x1a9b('t-1'), '2':_0x1a9b('t-2'), '3':_0x1a9b('t-3') };
        Object.keys(tabButtons).forEach(key=>{
            tabButtons[key].onclick=()=>{
                Object.values(tabButtons).forEach(b=>b.classList.remove('tab-active'));
                tabButtons[key].classList.add('tab-active');
                activeTab=key;
                renderAll();
            };
        });

        // Acciones CRUD
        _0x1a9b('add').onclick=()=>{
            let num=parseInt(_0x1a9b('pN').value), name=_0x1a9b('pM').value;
            if(num&&name){
                athletes.push({number:num,name:name});
                saveData();updateDropdown();renderAll();
                _0x1a9b('pN').value='';_0x1a9b('pM').value='';
                showToast('¡ATLETA REGISTRADO!');
            }
        };

        _0x1a9b('f').onsubmit=e=>{
            e.preventDefault();
            if(selectMenu.value&&actionInput.value){
                let log={playerNumber:parseInt(selectMenu.value),action:actionInput.value};
                setLogs[currentSet].push(log);
                saveData();renderAll();showToast('PUNTO REGISTRADO');
                document.querySelectorAll('.btn-action').forEach(x=>x.classList.remove('btn-selected'));actionInput.value="";
            }else{showToast('Seleccione Atleta y Acción')}
        };

        // Fijar y avanzar de Set
        _0x1a9b('cSet').onclick=()=>{
            if(confirm(`¿Estás seguro de cerrar y guardar de forma fija el SET ${currentSet}?`)){
                if(currentSet < 3){
                    currentSet++;
                    _0x1a9b('setIndicator').textContent=`SET ${currentSet}`;
                    saveData();
                    // Cambiar el foco visual al set entrante de forma automática
                    tabButtons[currentSet].click();
                    showToast(`SET ${currentSet-1} ARCHIVADO. ¡INICIA EL SET ${currentSet}!`);
                }else{
                    showToast('¡Límite de 3 Sets alcanzado para este juego!');
                }
            }
        };

        _0x1a9b('ra').onclick=()=>{
            if(confirm('¿Deseas resetear por completo el juego actual? Se borrarán todos los sets.')){
                localStorage.clear();
                location.href="index_menu.html";
            }
        };

        updateDropdown();renderAll();
    });
})();
</script>
</body>
</html>
