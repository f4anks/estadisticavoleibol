<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./img/logo.png">
    <link rel="apple-touch-icon" href="./img/logo.png">
    
    <title>Control Voley - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background: #111827; font-family: 'Inter', system-ui, sans-serif; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .card { background: #1f2937; border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 400px; }
        input { background: #374151 !important; border: 1px solid #4b5563 !important; color: white !important; transition: all 0.2s; }
        input:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59,130,246,0.3); outline: none; }
        .install-banner { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); box-shadow: 0 10px 30px -5px rgba(37,99,235,0.5); border: 1px solid rgba(255,255,255,0.2); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-6">

    <div id="iB" class="hidden install-banner w-full max-w-md p-4 rounded-3xl flex items-center justify-between mb-8 animate-bounce mt-4">
        <div class="flex items-center gap-3">
            <div class="bg-white p-1 rounded-xl shadow-inner">
                <img src="./img/logo.png" class="w-10 h-10 object-contain">
            </div>
            <div>
                <p class="text-xs font-black text-white leading-tight">Instalar Aplicación</p>
                <p class="text-[10px] text-blue-100 uppercase font-bold tracking-tighter">Disponible para uso Offline</p>
            </div>
        </div>
        <button id="iBtn" class="bg-white text-blue-700 px-5 py-2 rounded-xl text-xs font-black uppercase shadow-lg active:scale-90 transition-transform">Obtener</button>
    </div>

    <header class="flex flex-col items-center mb-10 mt-6 text-center">
        <img src="./img/logo.png" alt="Logo" class="w-28 h-28 mb-4 drop-shadow-[0_20px_20px_rgba(0,0,0,0.4)]">
        <h1 class="text-3xl font-black italic tracking-tighter uppercase">CONTROL <span class="text-blue-500">VOLEY</span></h1>
        <div class="h-1 w-12 bg-blue-600 mt-2 rounded-full"></div>
    </header>

    <main class="w-full max-w-md">
        <div class="card p-8">
            <h2 class="text-sm font-black text-center mb-8 text-blue-400 uppercase tracking-[0.3em]">Acceso al Sistema</h2>
            <form id="lF" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2 ml-1">Credenciales de Usuario</label>
                    <input type="email" id="e" required class="w-full px-5 py-4 rounded-2xl" placeholder="email@ejemplo.com">
                </div>
                <div>
                    <input type="password" id="p" required class="w-full px-5 py-4 rounded-2xl" placeholder="Contraseña">
                </div>
                
                <button type="submit" id="b" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl transition-all uppercase tracking-widest mt-4 active:scale-95">
                    Autenticar
                </button>
                
                <p id="err" class="text-center text-red-500 text-[10px] font-black mt-4 hidden uppercase tracking-widest bg-red-500/10 py-2 rounded-lg border border-red-500/20">Acceso Denegado</p>
            </form>
        </div>
    </main>

    <footer class="mt-auto py-8 opacity-40 text-center">
        <p class="text-[9px] font-bold uppercase tracking-[0.2em]">Programación: Sistematikos - Frank Hernandez</p>
        <p class="text-[8px] mt-1 uppercase font-bold italic">Versión Pro 2026</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        const fc = {
            apiKey: "AIzaSyB5RB7mm1j-0gjCNTUEJTkyEqLjyZ3C7ws",
            authDomain: "datacontrolvoley-ff556.firebaseapp.com",
            projectId: "datacontrolvoley-ff556",
            storageBucket: "datacontrolvoley-ff556.firebasestorage.app",
            messagingSenderId: "516409072606",
            appId: "1:516409072606:web:132538dba358a077d71b4f"
        };
        const a = initializeApp(fc), b = getAuth(a);

        // Salto automático si ya hay sesión
        onAuthStateChanged(b, u => { if(u) window.location.href='index_menu.html'; });

        // Login
        document.getElementById('lF').onsubmit = async (ev) => {
            ev.preventDefault();
            const btn = document.getElementById('b'), er = document.getElementById('err');
            btn.disabled = true; btn.textContent = "VERIFICANDO...";
            er.classList.add('hidden');
            
            try {
                await signInWithEmailAndPassword(b, document.getElementById('e').value, document.getElementById('p').value);
                window.location.href = 'index_menu.html';
            } catch (x) {
                er.classList.remove('hidden');
                btn.disabled = false; btn.textContent = "AUTENTICAR";
            }
        };

        // --- LÓGICA DE INSTALACIÓN PWA MEJORADA ---
        let dP;
        const banner = document.getElementById('iB');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            dP = e;
            // Retrasamos un segundo la aparición para que no sea tan brusco
            setTimeout(() => {
                banner.classList.remove('hidden');
            }, 1000);
        });

        document.getElementById('iBtn').onclick = async () => {
            if (dP) {
                dP.prompt();
                const { outcome } = await dP.userChoice;
                if (outcome === 'accepted') banner.classList.add('hidden');
                dP = null;
            }
        };

        // Registrar Service Worker y manejar actualizaciones
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // Forzar recarga para usar la nueva versión del caché (el login sin botón)
                                window.location.reload();
                            }
                        };
                    };
                });
            });
        }
    </script>
</body>
</html>
