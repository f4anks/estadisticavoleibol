<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./img/logo.png">
    <title>Voley Stats - Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body{background:#004080;font-family:'Inter',sans-serif;color:white;min-height:100vh;user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
        .app-bg{background:radial-gradient(circle at top,#0056FF 0%,#004080 100%)}
        .card{background-color:#fff;color:#1f2937;border-radius:1.5rem;box-shadow:0 10px 25px -5px rgba(0,0,0,0.4)}
        .active-btn{transition:transform 0.1s}.active-btn:active{transform:scale(0.96)}
        .hidden{display:none}
        input{border:1px solid #d1d5db!important;background-color:#f9fafb!important;color:#111827!important}
        input:focus{outline:none;border-color:#0056FF!important;box-shadow:0 0 0 3px rgba(0,86,255,0.2)}
    </style>
</head>

    <div id="installArea" class="hidden w-full max-w-md bg-blue-600 p-4 rounded-2xl flex items-center justify-between shadow-2xl animate-bounce mb-12">
        <div class="flex items-center gap-3">
            <img src="./img/logo.png" class="w-10 h-10 rounded-lg bg-white p-1">
            <div><p class="text-xs font-bold text-white">Instalar Voley Stats</p><p class="text-[10px] text-blue-100">Modo offline disponible</p></div>
        </div>
        <button id="btnInstall" class="bg-white text-blue-600 px-4 py-2 rounded-xl text-xs font-black uppercase">Obtener</button>
    </div>

    <header class="flex flex-col items-center mb-12 mt-4">
        <div class="bg-white p-5 rounded-[2.5rem] shadow-2xl mb-4 border-4 border-blue-400/20">
            <img src="./img/logo.png" alt="Logo" class="w-24 h-24 object-contain">
        </div>
        <h1 class="text-4xl font-black italic tracking-tighter text-center uppercase">VOLEY <span class="text-yellow-400">STATS</span></h1>
        <p class="text-blue-100 text-sm font-medium opacity-80 mt-2 text-center uppercase tracking-widest">Panel de Acceso</p>
    </header>

    <main class="w-full max-w-md">
        <div id="loginSection" class="card p-8 transition-all duration-500">
            <h2 class="text-2xl font-black text-center mb-6 text-blue-700 uppercase tracking-tight">Iniciar Sesión</h2>
            <form id="loginForm" class="space-y-4">
                <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl transition-all" placeholder="usuario@voleystats.com"></div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Contraseña</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl transition-all" placeholder="••••••••"></div>
                <button type="submit" id="btnLogin" class="active-btn w-full bg-[#0056FF] hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition-all uppercase tracking-widest mt-2">Autenticar</button>
                <p id="err" class="text-center text-red-500 text-xs font-bold mt-4 hidden"></p>
            </form>
        </div>

        <div id="accessSection" class="hidden flex flex-col items-center w-full transition-all duration-500">
            <p id="uidDisplay" class="text-[10px] text-blue-100 mb-3 font-mono font-bold tracking-wider opacity-90 bg-blue-900/40 px-4 py-1.5 rounded-full border border-blue-400/30">ID VERIFICADO</p>
            <a href="index_estad.html" class="active-btn card flex items-center justify-center w-full py-6 font-black text-blue-600 text-xl uppercase tracking-tighter border-2 border-blue-200">Entrar al Sistema</a>
            <button id="btnLogout" class="mt-6 text-blue-200 text-xs font-bold uppercase tracking-[0.2em] opacity-60 hover:opacity-100 transition-opacity">Cerrar Sesión</button>
        </div>
    </main>

    <footer class="mt-auto pt-16 pb-6 text-center">
        <p class="text-[10px] text-blue-300 uppercase font-bold tracking-[0.3em] mb-2">Versión Pro 2026</p>
        <p class="text-[9px] text-blue-400 opacity-70">Programación y Desarrollo: Sistematikos - Frank Hernandez</p>
    </footer>

    <script type="module">

</body>
</html>
