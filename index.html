<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voley Stats - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:#111827;font-family:'Inter',sans-serif;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;p:1.5rem}
        .card{background:#1f2937;padding:2.5rem;border-radius:2rem;width:100%;max-width:400px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
        input{background:#374151!important;border:1px solid #4b5563!important;color:white!important}
    </style>
</head>
<body>
    <div class="card">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black uppercase italic italic">Control <span class="text-blue-500">Voley</span></h1>
            <p class="text-gray-400 text-xs font-bold tracking-widest mt-2">SISTEMA DE AUTENTICACIÓN</p>
        </div>
        <form id="lF" class="space-y-4">
            <input type="email" id="e" placeholder="Correo Electrónico" class="w-full p-4 rounded-xl outline-none" required>
            <input type="password" id="p" placeholder="Contraseña" class="w-full p-4 rounded-xl outline-none" required>
            <button type="submit" id="b" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-black uppercase tracking-widest transition-all">Ingresar</button>
            <p id="err" class="text-red-500 text-center text-xs font-bold hidden">DATOS INCORRECTOS</p>
        </form>
    </div>

    <script type="module">
        import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        const fc={apiKey:"AIzaSyB5RB7mm1j-0gjCNTUEJTkyEqLjyZ3C7ws",authDomain:"datacontrolvoley-ff556.firebaseapp.com",projectId:"datacontrolvoley-ff556",storageBucket:"datacontrolvoley-ff556.firebasestorage.app",messagingSenderId:"516409072606",appId:"1:516409072606:web:132538dba358a077d71b4f"};
        const a=initializeApp(fc),b=getAuth(a);

        onAuthStateChanged(b,u=>{ if(u) window.location.href='index_menu.html'; });

        document.getElementById('lF').onsubmit=async(e)=>{
            e.preventDefault();
            const btn=document.getElementById('b'),er=document.getElementById('err');
            btn.disabled=true; btn.textContent="VALIDANDO...";
            try{
                await signInWithEmailAndPassword(b,document.getElementById('e').value,document.getElementById('p').value);
                window.location.href='index_menu.html';
            }catch(x){
                er.classList.remove('hidden'); btn.disabled=false; btn.textContent="INGRESAR";
            }
        };
    </script>
</body>
</html>
