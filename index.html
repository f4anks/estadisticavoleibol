<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voley Stats - Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:#004080;font-family:'Inter',sans-serif;color:white;min-height:100vh;user-select:none}
        .app-bg{background:radial-gradient(circle at top,#0056FF 0%,#004080 100%)}
        .card{background-color:#fff;color:#1f2937;border-radius:1.5rem;box-shadow:0 10px 25px -5px rgba(0,0,0,0.4)}
        .hidden{display:none}
    </style>
</head>
<body class="app-bg flex flex-col items-center justify-center p-6">
    <header class="flex flex-col items-center mb-8">
        <div class="bg-white p-5 rounded-[2.5rem] shadow-2xl mb-4"><img src="./img/logo.png" class="w-20 h-20"></div>
        <h1 class="text-3xl font-black italic tracking-tighter uppercase">VOLEY <span class="text-yellow-400">STATS</span></h1>
    </header>

    <main class="w-full max-w-md">
        <div id="loginSection" class="card p-8">
            <h2 class="text-xl font-black text-center mb-6 text-blue-700 uppercase">Iniciar Sesión</h2>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300" placeholder="Email">
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300" placeholder="Contraseña">
                <button type="submit" id="bn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase tracking-widest">Autenticar</button>
                <p id="er" class="text-center text-red-500 text-xs font-bold mt-4 hidden"></p>
            </form>
        </div>
    </main>

    <script type="module">
        import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        const fc={apiKey:"AIzaSyB5RB7mm1j-0gjCNTUEJTkyEqLjyZ3C7ws",authDomain:"datacontrolvoley-ff556.firebaseapp.com",projectId:"datacontrolvoley-ff556",storageBucket:"datacontrolvoley-ff556.firebasestorage.app",messagingSenderId:"516409072606",appId:"1:516409072606:web:132538dba358a077d71b4f"};
        const a=initializeApp(fc),b=getAuth(a);

        onAuthStateChanged(b,u=>{ if(u) window.location.href='index_menu.html'; });

        document.getElementById('loginForm').onsubmit=async(e)=>{
            e.preventDefault();
            const btn=document.getElementById('bn'), err=document.getElementById('er');
            btn.disabled=true; btn.textContent="VERIFICANDO...";
            try{
                await signInWithEmailAndPassword(b,document.getElementById('email').value,document.getElementById('password').value);
                window.location.href='index_menu.html';
            }catch(x){
                err.textContent="ACCESO DENEGADO"; err.classList.remove('hidden');
                btn.disabled=false; btn.textContent="AUTENTICAR";
            }
        };
    </script>
</body>
</html>
